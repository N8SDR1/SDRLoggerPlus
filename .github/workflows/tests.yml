# =============================================================================
# SDRLoggerPlus Test Pipeline
# =============================================================================
#
# Required GitHub Secrets:
#   - OPENAI_API_KEY:    OpenAI API key (only needed if AI live tests are enabled)
#   - ANTHROPIC_API_KEY: Anthropic API key (only needed if AI live tests are enabled)
#   - AI_LIVE_TESTS:     Set to 'true' to enable expensive AI live tests
#   - QRZ_USERNAME:      QRZ.com username (only needed if QRZ live tests are enabled)
#   - QRZ_PASSWORD:      QRZ.com password (only needed if QRZ live tests are enabled)
#   - QRZ_API_KEY:       QRZ.com API key (only needed if QRZ live tests are enabled)
#   - QRZ_LIVE_TESTS:    Set to 'true' to enable rate-limited QRZ live tests
#
# Test Categories:
#   - Unit:        Fast, isolated tests with no external dependencies. Always run.
#   - Integration: Tests that verify component interactions (mocked external services).
#                  Always run on CI.
#   - LiveAI:      Tests that call real AI APIs (OpenAI, Anthropic). Expensive and
#                  slow. Only run when AI_LIVE_TESTS secret is 'true' or manually
#                  triggered with run_ai_tests input.
#   - RateLimited: Tests that call rate-limited external APIs (QRZ.com). Only run
#                  when QRZ_LIVE_TESTS secret is 'true' or manually triggered with
#                  run_qrz_tests input.
#
# Enabling/Disabling Expensive Tests:
#   - Via secrets: Set AI_LIVE_TESTS or QRZ_LIVE_TESTS to 'true' in repo settings
#     to always run these tests on PRs and pushes.
#   - Via manual trigger: Use "Run workflow" in the Actions tab and check the
#     desired test inputs. Manual inputs override secret-based defaults.
#
# =============================================================================

name: Tests

on:
  # No branch filter: `pull_request.branches` matches the PR's BASE branch, so
  # `[main]` meant this pipeline never ran on real work — everything targets
  # v2-alpha. Running on every PR regardless of base also survives the eventual
  # v2-alpha -> main cutover without another edit here.
  pull_request:
  push:
    branches: [v2-alpha, main]
  workflow_dispatch:
    inputs:
      run_ai_tests:
        description: 'Run expensive AI live tests'
        type: boolean
        default: false
      run_qrz_tests:
        description: 'Run rate-limited QRZ live tests'
        type: boolean
        default: false

jobs:
  backend-tests:
    name: Backend Tests (.NET) — ${{ matrix.label }}
    runs-on: ubuntu-latest
    # A hung test run used to inherit GitHub's 6-hour default and sit on a runner that
    # whole time, while `build-check` (which needs this job) never started. A healthy
    # run finishes in 2-3 minutes.
    timeout-minutes: 15

    # Run the whole suite across UTC + a negative-offset and a positive-offset zone.
    # QSO date/time is stored/compared in UTC and this class of bug is INVISIBLE on a
    # UTC-only runner (see docs/design/timezone-architecture.md — the day-boundary
    # miss only shows when the server's local day differs from UTC). This matrix is the
    # standing guard against a timezone regression sneaking back in.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tz: 'UTC',              label: 'utc' }
          - { tz: 'America/New_York', label: 'us-eastern' }   # negative offset
          - { tz: 'Pacific/Auckland', label: 'nz' }           # positive offset

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      TZ: ${{ matrix.tz }}
      AI_LIVE_TESTS: ${{ secrets.AI_LIVE_TESTS }}
      QRZ_LIVE_TESTS: ${{ secrets.QRZ_LIVE_TESTS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/SDRLoggerPlus.Server.Tests/SDRLoggerPlus.Server.Tests.csproj

      - name: Build
        run: dotnet build src/SDRLoggerPlus.Server.Tests/SDRLoggerPlus.Server.Tests.csproj --no-restore -c Release

      # --blame-hang aborts a stalled run and names the test that was in flight. Without it a
      # deadlocked test just goes quiet and the only symptom is a job that never ends. 180s is
      # far above the ~2s these suites actually take.
      - name: Run unit tests
        run: dotnet test src/SDRLoggerPlus.Server.Tests/SDRLoggerPlus.Server.Tests.csproj --no-build -c Release --filter "Category=Unit" --blame-hang --blame-hang-timeout 180s --blame-hang-dump-type none --logger "trx;LogFileName=unit-results.trx" --results-directory ./test-results

      - name: Run integration tests
        run: dotnet test src/SDRLoggerPlus.Server.Tests/SDRLoggerPlus.Server.Tests.csproj --no-build -c Release --filter "Category=Integration" --blame-hang --blame-hang-timeout 180s --blame-hang-dump-type none --logger "trx;LogFileName=integration-results.trx" --results-directory ./test-results

      - name: Run AI live tests
        if: env.AI_LIVE_TESTS == 'true' || github.event.inputs.run_ai_tests == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: dotnet test src/SDRLoggerPlus.Server.Tests/SDRLoggerPlus.Server.Tests.csproj --no-build -c Release --filter "Category=LiveAI" --logger "trx;LogFileName=liveai-results.trx" --results-directory ./test-results

      - name: Run QRZ rate-limited tests
        if: env.QRZ_LIVE_TESTS == 'true' || github.event.inputs.run_qrz_tests == 'true'
        env:
          QRZ_USERNAME: ${{ secrets.QRZ_USERNAME }}
          QRZ_PASSWORD: ${{ secrets.QRZ_PASSWORD }}
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
        run: dotnet test src/SDRLoggerPlus.Server.Tests/SDRLoggerPlus.Server.Tests.csproj --no-build -c Release --filter "Category=RateLimited" --logger "trx;LogFileName=qrz-results.trx" --results-directory ./test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results-${{ matrix.label }}
          path: ./test-results/*.trx
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SDRLoggerPlus.Web/package-lock.json

      - name: Install dependencies
        working-directory: src/SDRLoggerPlus.Web
        run: npm ci

      - name: Lint
        working-directory: src/SDRLoggerPlus.Web
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: src/SDRLoggerPlus.Web
        run: npm run build

      - name: Test
        working-directory: src/SDRLoggerPlus.Web
        run: npm run test

  build-check:
    name: Full Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SDRLoggerPlus.Web/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build frontend
        working-directory: src/SDRLoggerPlus.Web
        run: |
          npm ci
          npm run build

      - name: Copy frontend to wwwroot
        run: mkdir -p src/SDRLoggerPlus.Server/wwwroot && cp -r src/SDRLoggerPlus.Web/dist/* src/SDRLoggerPlus.Server/wwwroot/

      - name: Build .NET solution
        run: dotnet build --configuration Release
